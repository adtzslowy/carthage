services:
  postgres:
    image: postgres:17
    container_name: carthage_postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: carthage
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - carthage_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d carthage"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  carthage_postgres_data: